<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Garflix</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body bgcolor="orange">
    <center>
      <h1>Garflix</h1>
      <p>The #1 streaming site for one lazy orange cat.</p>
    </center>

    <hr />

    <!-- LAYOUT TABLE: puts the 3 sections side-by-side, 90's style -->
    <table
      border="0"
      cellpadding="10"
      cellspacing="0"
      align="center"
      width="100%"
    >
      <tr valign="top">
        <!-- SECTION 1: HTML table with info + link -->
        <td align="center">
          <table border="1" cellpadding="5" cellspacing="0" align="center">
            <tr>
              <th colspan="2">Garfield Facts</th>
            </tr>
            <tr>
              <td>Species</td>
              <td>Cat</td>
            </tr>
            <tr>
              <td>Owner</td>
              <td>Jon Arbuckle</td>
            </tr>
            <tr>
              <td>Favorite Food</td>
              <td>Lasagna</td>
            </tr>
            <tr>
              <td>Hates</td>
              <td>Mondays</td>
            </tr>
            <tr>
              <td colspan="2" align="center">
                <a href="https://en.wikipedia.org/wiki/Garfield" target="_blank"
                  >Read more on Wikipedia</a
                >
              </td>
            </tr>
          </table>
        </td>

        <!-- SECTION 2: image, relative path -->
        <td align="center">
          <h2>Garfield</h2>
          <img src="assets/img/garfield.jpg" alt="Garfield" width="300" />
        </td>

        <!-- SECTION 3: image, absolute path -->
        <td align="center">
          <h2>Garfield and Jon</h2>
          <img
            src="https://img.etimg.com/photo/msid-64691404/garfield-turns-40-lazy-grouchy-cat-is-worth-800-mn-and-founder-jim-davis-loves-it.jpg"
            alt="Garfield again"
            width="300"
          />
        </td>
      </tr>
    </table>

    <hr />

    <footer>
      <center>
        <p>
          <a href="https://github.com/tonyaleman" target="_blank"
            >My GitHub Profile</a
          >
          |
          <a href="https://github.com/tonyaleman/miniature-carnival-alfa-throwback" target="_blank"
            >Source Code</a
          >
        </p>
      </center>
    </footer>

    <script src="assets/scripts/script.js"></script>
  </body>
</html>
